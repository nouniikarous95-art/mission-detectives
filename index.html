        html += `
          <div class="options">
            <button class="btn-opt innocent" onclick="handleVerdict(${tId}, false, this)"><span style="font-size:2.5rem;">😇</span> Innocente</button>
            <button class="btn-opt coupable" onclick="handleVerdict(${tId}, true, this)"><span style="font-size:2.5rem;">🕵️‍♀️</span> Coupable</button>
          </div>`;
      } else if (ts.state === "fix") {
        html += `
          <h3 style="text-align:center; color:var(--pink); margin-bottom:15px;">Coupable ! Quelle est la bonne phrase ?</h3>
          <div class="fix-options">
            ${q.fixOpts.map((opt, i) => `<button class="fix-btn" onclick="handleFix(${tId}, ${i}, this)">${opt}</button>`).join('')}
          </div>`;
      } else if (ts.state === "explain") {
        html += `
          <div class="explain-box">
            <h3 class="explain-title">🤔 Pourquoi ? (Justification)</h3>
            <p style="text-align:center; font-weight:bold; margin-bottom:15px;">Pour valider ce dossier, expliquez votre choix !</p>
            <div class="fix-options">
              ${q.explOpts.map((opt, i) => `<button class="fix-btn" style="border-color:var(--lav);" onclick="handleExplain(${tId}, ${i}, this)">${opt}</button>`).join('')}
            </div>
          </div>`;
      }

      html += `
          <div style="margin-top:30px; text-align:center;">
            ${!ts.helpRequested
              ? `<button class="btn-action" style="background:var(--sun); color:#6b4a00; border:2px solid #b8962e;" onclick="requestHelp(${tId})">🚨 Appeler Madame la Juge</button>`
              : `<p style="color:var(--pink); font-weight:bold; animation:pulse 1s infinite;">🚨 Madame la Juge est prévenue. Attendez-la !</p>
                 <button class="btn-action" style="background:var(--mute); font-size:.9rem; padding:6px 12px; margin-top:10px;" onclick="clearHelp(${tId})">Annuler l'appel</button>`}
          </div>
        </div>`;
      return html;
    }

    /* =========================================================================
       ACTIONS
       ========================================================================= */
    let busy = false; // empêche le double-clic de compter deux fois les points

    function lockButtons() {
      document.querySelectorAll('.btn-opt, .fix-btn').forEach(b => b.disabled = true);
    }

    function feedbackWrong(btn, tId) {
      btn.style.background = "var(--pink)"; btn.style.color = "#fff";
      playSound('wrong');
      showFloatingScore(btn, `+${PENALTY_SEC} s`, true);
      setTimeout(() => { btn.style.background = "#fff"; btn.style.color = "var(--ink)"; }, 500);
      addError(tId);
    }
    function addError(tId) {
      mutate((s) => { if (!s.teams[tId].ruleUnlocked) s.teams[tId].errors = (s.teams[tId].errors || 0) + 1; });
    }

    window.toggleOther = function () {
      const sel = $('#teacher-select');
      $('#other-wrap').style.display = sel.value === '__other__' ? 'block' : 'none';
    };

    window.rollDice = function () {
      if (isRolling) return;
      const select = $('#teacher-select');
      if (!select) return;
      let name = select.value;
      if (name === '__other__') name = ($('#other-name')?.value || '').trim();
      if (!name) { showToast("Écrivez votre nom, s'il vous plaît.", false); return; }
      const state = getState();
      if (state.assignments[name] !== undefined) { showToast("Ce nom a déjà été tiré au sort.", false); return; }
      if (![0, 1, 2].some(i => state.tirageCounts[i] < MAX_PER_TEAM)) { showToast("Toutes les brigades sont complètes !", false); return; }

      isRolling = true;
      playSound('correct');
      const btn = $('#btn-roll');
      btn.disabled = true;
      select.disabled = true;
      const spinnerBox = $('#spinner-box');
      spinnerBox.classList.add('spinning');

      let ticks = 0;
      const interval = setInterval(async () => {
        spinnerBox.innerHTML = `<span style="font-size:5rem;">${TEAMS[Math.floor(Math.random() * 3)].icon}</span>`;
        ticks++;
        if (ticks <= 20) return;
        clearInterval(interval);
        spinnerBox.classList.remove('spinning');

        let chosenId = -1;
        await mutate((s) => {
          if (s.assignments[name] !== undefined) { chosenId = s.assignments[name]; return; }
          const avail = [0, 1, 2].filter(i => s.tirageCounts[i] < MAX_PER_TEAM);
          if (!avail.length) { chosenId = -1; return; }
          chosenId = avail[Math.floor(Math.random() * avail.length)];
          s.assignments[name] = chosenId;
          s.tirageCounts[chosenId]++;
        });
        if (chosenId >= 0) lsSet('md_me', name);

        if (chosenId < 0) { isRolling = false; showToast("Toutes les brigades sont complètes !", false); render(); return; }
        const t = TEAMS[chosenId];
        spinnerBox.style.background = t.color;
        spinnerBox.innerHTML = `
          <span style="font-size:5rem;">${t.icon}</span>
          <div class="spinner-text" style="color:#fff">${t.name}</div>
          <div style="font-size:1.1rem; color:#fff; font-weight:bold; margin-top:10px;">Redirection en cours… 🚀</div>`;
        playSound('reveal');
        fireConfetti();
        setTimeout(() => { isRolling = false; location.hash = 'brigade-' + chosenId; render(); }, 2000);
      }, 100);
    };

    window.resetTirage = async function () {
      if (!isAdmin()) return;
      if (!(await askConfirm('🎲 Refaire le tirage ?', 'Les noms et les brigades seront effacés.', 'Oui, effacer'))) return;
      await mutate((s) => { s.tirageCounts = [0, 0, 0]; s.assignments = {}; });
      showToast('✅ Tirage réinitialisé');
    };

    function showFloatingScore(el, text, isPenalty = false) {
      if (!el) return;
      const r = el.getBoundingClientRect();
      const f = document.createElement('div');
      f.className = 'floating-score' + (isPenalty ? ' penalty' : '');
      f.innerText = text;
      f.style.left = (r.left + r.width / 2) + 'px';
      f.style.top = r.top + 'px';
      document.body.appendChild(f);
      setTimeout(() => f.remove(), 1000);
    }

    window.startInvestigation = function (tId) {
      if (!canPlay()) return;
      mutate((s) => { if (s.teams[tId].state === "intro") s.teams[tId].state = "judge"; });
      playSound('bonus');
    };

    // Chaque étape vérifie l'état actuel (qIndex + étape) avant d'ajouter des points.
    function stepGuard(s, tId, expectedQ, expectedStep) {
      return s.teams[tId].qIndex === expectedQ && s.teams[tId].state === expectedStep;
    }

    function canPlay() { const st = getState(); return st.timer.isRunning && getTimerRemaining(st) > 0; }

    window.handleVerdict = function (tId, chosenCoupable, btn) {
      if (busy || !canPlay()) return;
      const ts = getState().teams[tId];
      const qi = ts.qIndex;
      const q = QUESTIONS[tId][qi];
      if (chosenCoupable !== q.isCoupable) { btn.classList.add('wrong'); playSound('wrong'); showFloatingScore(btn, `+${PENALTY_SEC} s`, true); setTimeout(() => btn.classList.remove('wrong'), 500); addError(tId); return; }
      busy = true; lockButtons();
      btn.classList.add('correct'); playSound('correct'); showFloatingScore(btn, "✔");
      setTimeout(async () => {
        await mutate((s) => {
          if (!stepGuard(s, tId, qi, "judge")) return;
          s.teams[tId].score += 1;
          s.teams[tId].state = q.isCoupable ? "fix" : "explain";
        });
        busy = false;
      }, 800);
    };

    window.handleFix = function (tId, idx, btn) {
      if (busy || !canPlay()) return;
      const qi = getState().teams[tId].qIndex;
      const q = QUESTIONS[tId][qi];
      if (idx !== q.fixAns) { feedbackWrong(btn, tId); return; }
      busy = true; lockButtons();
      btn.style.background = "var(--mint)"; btn.style.color = "#fff"; btn.style.borderColor = "var(--mint)";
      playSound('correct'); showFloatingScore(btn, "✔");
      setTimeout(async () => {
        await mutate((s) => {
          if (!stepGuard(s, tId, qi, "fix")) return;
          s.teams[tId].score += 1;
          s.teams[tId].state = "explain";
        });
        busy = false;
      }, 800);
    };

    window.handleExplain = function (tId, idx, btn) {
      if (busy || !canPlay()) return;
      const qi = getState().teams[tId].qIndex;
      const q = QUESTIONS[tId][qi];
      if (idx !== q.explAns) { feedbackWrong(btn, tId); return; }
      busy = true; lockButtons();
      btn.style.background = "var(--lav)"; btn.style.color = "#fff";
      playSound('correct'); showFloatingScore(btn, "✔");
      setTimeout(async () => {
        let letterAdded = false, finished = false;
        await mutate((s) => {
          if (!stepGuard(s, tId, qi, "explain")) return;
          const t = s.teams[tId];
          t.score += 1;
          letterAdded = true;
          t.qIndex += 1;
          t.state = "judge";
          t.helpRequested = false;
          finished = t.qIndex >= QUESTIONS[tId].length;
        });
        busy = false;
        if (letterAdded) playSound('reveal');
        if (finished) fireConfetti();
      }, 800);
    };

    window.handleRule = function (tId, idx, btn) {
      if (busy || !canPlay()) return;
      if (idx !== RULES[tId].ans) { feedbackWrong(btn, tId); return; }
      busy = true; lockButtons();
      btn.style.background = "var(--mint)"; btn.style.color = "#fff";
      playSound('correct'); showFloatingScore(btn, "🏁");
      setTimeout(async () => {
        await mutate((s) => {
          if (s.teams[tId].ruleUnlocked) return;
          s.teams[tId].ruleUnlocked = true;
          s.teams[tId].score += 3;
          s.teams[tId].finishElapsed = elapsedNow(s);
        });
        busy = false;
        fireConfetti();
      }, 800);
    };

    window.requestHelp = (tId) => mutate((s) => { s.teams[tId].helpRequested = true; });
    window.clearHelp = (tId) => mutate((s) => { s.teams[tId].helpRequested = false; });

    // Actions de la Juge
    window.addTime = function (tId, sec) {
      mutate((s) => { s.teams[tId].adjust = (s.teams[tId].adjust || 0) + sec; });
      playSound(sec < 0 ? 'bonus' : 'wrong');
    };

    window.launchSurprise = async function (k) {
      if (!isJuge()) return;
      if (!(await askConfirm('⚡ Lancer la question surprise ?', `« ${SURPRISE_QUESTIONS[k].q} » apparaîtra sur tous les appareils.`, 'Lancer !'))) return;
      await mutate((s) => { s.surprise = { active: true, qIndex: k, answers: [], winner: null, winnerAnswer: null }; });
    };
    window.cancelSurprise = async function () {
      if (!isJuge()) return;
      if (!(await askConfirm('Fermer la question surprise ?', 'Elle disparaîtra des appareils (les réponses seront effacées).', 'Oui, fermer'))) return;
      await mutate((s) => { s.surprise = { active: false, qIndex: 0, answers: [], winner: null, winnerAnswer: null }; });
    };
    window.validateSurprise = async function (team, k) {
      if (!isJuge()) return;
      const st = getState();
      const answers = [...surpriseOf(st).answers].sort((x, y) => x.at - y.at);
      const a = answers[k];
      if (!a) return;
      if (!(await askConfirm(`🏆 Valider la réponse de ${TEAMS[team].name} ?`, `« ${a.text} » — ${a.name}. Cette brigade gagne la dernière lettre et la partie.`, 'Valider'))) return;
      await mutate((s) => {
        const sp = s.surprise || {};
        if (sp.winner !== null && sp.winner !== undefined) return;
        sp.winner = team; sp.winnerAnswer = a.text; sp.active = false;
        s.surprise = sp;
      });
      playSound('reveal'); setTimeout(fireConfetti, 300);
    };
    window.sendSurprise = async function (tId) {
      const st = getState();
      const sp = surpriseOf(st);
      if (!sp.active) return;
      const nameInp = document.getElementById('me-name');
      if (nameInp) { const n = nameInp.value.trim(); if (!n) { showToast('Écrivez votre nom', false); return; } lsSet('md_me', n); }
      const me = myName();
      const txt = (document.getElementById('sp-answer')?.value || '').trim();
      if (!txt) { showToast('Écrivez votre réponse', false); return; }
      const at = Date.now();
      await mutate((s) => {
        const p = s.surprise;
        if (!p || !p.active) return;
        if (p.answers.some(a => a.name === me)) return;
        p.answers.push({ name: me, team: tId, text: txt, at });
      });
      playSound('bonus');
      showToast('📨 Réponse envoyée !');
    };

    window.togglePodium = function () {
      let shown = false;
      mutate((s) => { s.showPodium = !s.showPodium; shown = s.showPodium; })
        .then(() => { if (shown) { playSound('bonus'); setTimeout(fireConfetti, 500); setTimeout(fireConfetti, 1500); } });
    };

    /* =========================================================================
       MINUTEUR
       ========================================================================= */
    function getTimerRemaining(state) {
      if (!state.timer.isRunning) return state.timer.remaining;
      const passed = Math.floor((Date.now() - state.timer.lastStart) / 1000);
      return Math.max(0, state.timer.remaining - passed);
    }

    window.startTimer = () => mutate((s) => {
      if (s.timer.isRunning) return;
      if (s.timer.remaining <= 0) s.timer.remaining = ENQUETE_MINUTES * 60;
      s.timer.isRunning = true; s.timer.lastStart = Date.now();
    });

    window.pauseTimer = () => mutate((s) => {
      if (!s.timer.isRunning) return;
      s.timer.remaining = getTimerRemaining(s);
      s.timer.isRunning = false;
    });

    window.resetTimer = async () => {
      if (!(await askConfirm('⏱ Remettre le chrono ?', `Le chrono repartira à ${ENQUETE_MINUTES} minutes.`, 'Oui'))) return;
      await mutate((s) => { s.timer = { isRunning: false, remaining: TOTAL_SEC, lastStart: 0 }; });
      showToast('⏱ Chrono remis à zéro');
    };

    // Son du minuteur : réglage propre à chaque appareil (activé par défaut sur l'écran géant)
    function soundKey() { return 'md_sound_' + getRoute().view; }
    function soundOn() {
      try { const v = localStorage.getItem(soundKey()); if (v !== null) return v === '1'; } catch (e) {}
      return getRoute().view === 'screen';
    }
    window.toggleSound = function () {
      initAudio();
      try { localStorage.setItem(soundKey(), soundOn() ? '0' : '1'); } catch (e) {}
      if (soundOn()) playSound('bonus');
      render();
    };

    let lastRem = null, alarmFor = -1;
    function timerSounds(rem, st) {
      if (!soundOn() || !['screen', 'referee'].includes(getRoute().view)) return;
      if (rem === lastRem) return;
      lastRem = rem;
      if (rem === 0) {
        if (alarmFor !== st.timer.lastStart) { alarmFor = st.timer.lastStart; playAlarm(); }
        return;
      }
      if (rem === 300 || rem === 60) { playChime(); return; }      // 5 min et 1 min restantes
      if (rem <= 10) { tone(1046, .14, .35, 'square'); return; }  // 10 dernières secondes : bip fort
      if (rem <= 60) { tone(rem % 2 ? 1200 : 900, .05, .16, 'square'); return; } // dernière minute : tic-tac rapide et plus fort
      tone(rem % 2 ? 1000 : 750, .03, .05, 'square');              // tic-tac doux
    }

    setInterval(() => {
      const state = getState();
      const rem = getTimerRemaining(state);
      document.querySelectorAll('.timer-text').forEach(el => {
        const txt = fmtTime(rem);
        if (el.innerText !== txt) el.innerText = txt;
        el.classList.toggle('warning', rem <= 60 && rem > 0);
      });
      document.querySelectorAll('.team-time').forEach(el => {
        const i = +el.dataset.team;
        const txt = fmtTime(teamTime(state, i));
        if (el.innerText !== txt) el.innerText = txt;
      });
      if (state.timer.isRunning) {
        timerSounds(rem, state);
        // la brigade voit « Temps écoulé » dès la fin
        if (rem === 0 && getRoute().view === 'team' && !document.querySelector('[data-timeup]')) render();
      }
    }, 250);

    /* =========================================================================
       SONS (compatible iPad / iPhone)
       ========================================================================= */
    let audioCtx = null;
    window.initAudio = initAudio;
    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }
    document.addEventListener('click', initAudio, { once: true });
    document.addEventListener('touchstart', initAudio, { once: true });

    function tone(freq, dur, vol, type = 'sine', delay = 0) {
      try {
        if (!audioCtx) initAudio();
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime + delay;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
        o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + dur + .02);
      } catch (e) {}
    }
    function playChime() { tone(784, .25, .3, 'sine'); tone(1047, .4, .3, 'sine', .25); }
    function playAlarm() {
      for (let k = 0; k < 6; k++) { tone(880, .25, .45, 'sawtooth', k * .5); tone(660, .25, .45, 'sawtooth', k * .5 + .25); }
      tone(440, 1.2, .5, 'square', 3.1);
    }

    function playSound(type) {
      try {
        if (!audioCtx) initAudio();
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const t = audioCtx.currentTime;
        if (type === 'correct') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, t); osc.frequency.setValueAtTime(659.25, t + .1);
          gain.gain.setValueAtTime(.5, t); gain.gain.exponentialRampToValueAtTime(.01, t + .5); osc.start(); osc.stop(t + .5);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.linearRampToValueAtTime(100, t + .3);
          gain.gain.setValueAtTime(.5, t); gain.gain.linearRampToValueAtTime(.01, t + .3); osc.start(); osc.stop(t + .3);
        } else if (type === 'bonus') {
          osc.type = 'triangle'; osc.frequency.setValueAtTime(440, t); osc.frequency.setValueAtTime(880, t + .1);
          gain.gain.setValueAtTime(.3, t); gain.gain.exponentialRampToValueAtTime(.01, t + .5); osc.start(); osc.stop(t + .5);
        } else if (type === 'reveal') {
          osc.type = 'square'; osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(1200, t + .2);
          gain.gain.setValueAtTime(.2, t); gain.gain.exponentialRampToValueAtTime(.01, t + .6); osc.start(); osc.stop(t + .6);
        }
      } catch (e) {}
    }

    /* =========================================================================
       CONFETTIS
       ========================================================================= */
    function fireConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      const colors = ['#e83e8c', '#6f42c1', '#20c997', '#ffc107'];
      const parts = Array.from({ length: 150 }, () => ({
        x: canvas.width / 2, y: canvas.height, r: Math.random() * 8 + 4,
        c: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - .5) * 20, vy: -(Math.random() * 15 + 15), a: Math.random() * Math.PI * 2
      }));
      let frame = 0;
      (function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;
        parts.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += .5; p.a += .1;
          if (p.y < canvas.height) active = true;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
          ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.5); ctx.restore();
        });
        if (active && frame < 300) { frame++; requestAnimationFrame(animate); }
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      })();
    }

    window.render = render;
    render();
    initFirebase();
  </script>
</body>
</html>
