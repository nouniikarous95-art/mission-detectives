<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mission Détectives : Le Tribunal</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,600&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f9fa; --ink: #212529; --mute: #6c757d; --line: #dee2e6; --card: #ffffff;
      --pink: #e83e8c; --pink-s: #f8d7da; --berry: #bd2130;
      --lav: #6f42c1; --lav-s: #e2d9f3; --mint: #20c997; --mint-s: #d4edda;
      --peach: #fd7e14; --sun: #ffc107; --sun-s: #fff3cd; --gold: #d4af37;
      --display: "Fraunces", Georgia, serif;
      --body: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--ink); font-family: var(--body); margin: 0; padding: 0; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    h1, h2, h3 { font-family: var(--display); margin: 0; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    select, input.name-input { font-family: inherit; outline: none; border: 3px solid var(--line); border-radius: 12px; padding: 12px; font-size: 1.2rem; font-weight: bold; color: var(--ink); background: #fff; width: 100%; max-width: 350px; text-align: center; }
    select:focus, input.name-input:focus { border-color: var(--lav); }

    .container { max-width: 1200px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; min-height: 100vh; }
    .card { background: var(--card); border: 3px solid var(--line); border-radius: 24px; padding: 25px; box-shadow: 0 12px 0 rgba(0,0,0,.05); }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; padding: 6px 14px; border-radius: 999px; background: var(--lav-s); color: var(--lav); margin-bottom: 15px; }

    .progress-bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 15px; }
    .progress-fill { height: 100%; background: var(--ink); transition: width .3s ease; }

    .grid-login { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
    .btn-login { background: #fff; border: 3px solid var(--line); border-radius: 20px; padding: 20px; font-size: 1.2rem; font-weight: bold; color: var(--ink); text-align: left; transition: all .2s; box-shadow: 0 6px 0 var(--line); display: flex; flex-direction: column; gap: 5px; }
    .btn-login:active { transform: translateY(6px); box-shadow: none; }
    .btn-login .icon { font-size: 2.5rem; }

    .spinner-box { font-size: 5rem; margin: 20px 0; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--lav-s); border-radius: 24px; padding: 20px; transition: all .3s; }
    .spinner-text { font-family: var(--display); font-size: 2rem; margin-top: 10px; font-weight: 900; text-align: center; }
    .spinning { animation: shake .2s infinite; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 15px 20px; border-radius: 20px; border: 3px solid var(--line); font-weight: bold; gap: 10px; }
    .track { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    .lane { display: grid; grid-template-columns: 140px 1fr 90px; align-items: center; gap: 15px; }
    .lane-name { font-weight: 900; font-size: 1.1rem; }
    .road { position: relative; height: 40px; background: var(--line); border-radius: 999px; overflow: hidden; }
    .fill { position: absolute; left: 0; top: 0; bottom: 0; transition: width .8s cubic-bezier(.4,0,.2,1); }
    .score { font-family: var(--display); font-size: 1.8rem; font-weight: 900; text-align: right; }

    .safe-container { background: var(--ink); color: #fff; padding: 30px; border-radius: 24px; text-align: center; margin-top: 30px; box-shadow: 0 15px 30px rgba(0,0,0,.2); }
    .safe-letters { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .letter-slot { width: 46px; height: 60px; background: rgba(255,255,255,.1); border: 3px dashed rgba(255,255,255,.3); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 2.2rem; font-weight: 900; color: var(--gold); transition: all .5s; }
    .letter-slot.revealed { background: var(--card); border-color: var(--gold); border-style: solid; animation: pop .4s ease; }

    .devinette-box { background: var(--sun); color: #6b4a00; border: 4px solid #b8962e; border-radius: 24px; padding: 30px; margin-top: 20px; text-align: center; animation: pop .5s cubic-bezier(.175,.885,.32,1.275); }

    .question-box { text-align: center; margin: 20px 0; background: var(--sun-s); padding: 25px; border-radius: 16px; }
    .question-box h2 { font-size: 1.8rem; margin-bottom: 20px; line-height: 1.3; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .btn-opt { background: var(--card); border: 3px solid var(--line); border-radius: 16px; padding: 20px; font-size: 1.3rem; font-weight: bold; color: var(--ink); transition: transform .1s; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .btn-opt:active { transform: scale(.98); }
    .btn-opt.innocent { border-color: var(--mint); color: var(--mint); }
    .btn-opt.coupable { border-color: var(--pink); color: var(--pink); }
    .btn-opt.correct { background: var(--mint); color: #fff; border-color: var(--mint); }
    .btn-opt.wrong { background: var(--pink); color: #fff; border-color: var(--pink); animation: shake .4s; }

    .fix-options { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .fix-btn { background: #fff; border: 2px solid var(--mute); padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; text-align: left; color: var(--ink); }

    .explain-box { background: var(--lav-s); border: 3px solid var(--lav); padding: 25px; border-radius: 16px; margin-top: 20px; }
    .explain-title { color: var(--lav); font-family: var(--display); font-size: 1.8rem; margin-bottom: 15px; text-align: center; }

    .vip-grid { display: grid; gap: 15px; margin-top: 20px; }
    .vip-team { background: #fff; padding: 15px; border-radius: 16px; border: 3px solid var(--line); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .vip-controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .vip-btn { padding: 8px 12px; font-weight: bold; border-radius: 8px; font-size: .9rem; }
    .vip-btn.bonus { background: var(--lav); color: #fff; }
    .vip-btn.letter { background: var(--gold); color: #000; border: 2px solid #b8962e; font-size: 1.1rem; padding: 12px 20px; border-radius: 12px; width: 100%; margin-top: 10px; }
    .alert-badge { background: var(--pink); color: #fff; padding: 4px 8px; border-radius: 999px; font-size: .8rem; font-weight: bold; animation: pulse 1s infinite; display: inline-block; }

    .timer-display { font-family: var(--display); font-size: 2.5rem; font-weight: 900; background: var(--ink); color: #fff; padding: 10px 25px; border-radius: 16px; letter-spacing: 2px; }
    .timer-display.warning { color: var(--pink); animation: pulse 1s infinite; }
    .podium-container { display: flex; align-items: flex-end; justify-content: center; gap: 20px; height: 350px; margin-top: 60px; }
    .podium-step { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 150px; border-radius: 16px 16px 0 0; color: #fff; font-family: var(--display); font-weight: 900; font-size: 2rem; padding-bottom: 20px; text-align: center; position: relative; }
    .podium-step .team-name { position: absolute; top: -50px; font-size: 1.2rem; color: var(--ink); white-space: nowrap; }
    .podium-step .team-score { position: absolute; top: -25px; font-size: 1rem; color: var(--mute); font-family: var(--body); }
    .podium-1 { height: 100%; background: var(--gold); }
    .podium-2 { height: 75%; background: var(--line); color: var(--ink); }
    .podium-3 { height: 50%; background: var(--peach); }

    .btn-action { background: var(--ink); color: #fff; padding: 12px 24px; border-radius: 999px; font-weight: 900; font-size: 1.1rem; }
    .flex-center { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 9999; }

    /* Connection badge */
    .conn { position: fixed; right: 12px; bottom: 12px; z-index: 50; font-size: .8rem; font-weight: 900; padding: 6px 12px; border-radius: 999px; box-shadow: 0 4px 10px rgba(0,0,0,.1); }
    .conn.online { background: var(--mint-s); color: #0f6b4f; }
    .conn.local { background: var(--sun-s); color: #7a5600; }

    .floating-score { position: fixed; font-family: var(--display); font-size: 2.5rem; font-weight: 900; color: var(--mint); text-shadow: 0 4px 8px rgba(0,0,0,.3); pointer-events: none; animation: floatUp 1s cubic-bezier(.175,.885,.32,1.275) forwards; z-index: 10000; transform: translate(-50%,-50%); }
    .floating-score.penalty { color: var(--pink); }
    @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%,-50%) scale(.5); } 100% { opacity: 0; transform: translate(-50%,-120px) scale(1.5); } }
    .glow-effect { box-shadow: 0 0 20px 5px rgba(255,193,7,.6); }

    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
    @keyframes pulse { 0%{opacity:1} 50%{opacity:.5} 100%{opacity:1} }
    @keyframes pop { 0%{transform:scale(.8)} 70%{transform:scale(1.1)} 100%{transform:scale(1)} }

    /* Modale de confirmation, messages et code d'accès */
    .modal-bg { position: fixed; inset: 0; background: rgba(33,37,41,.55); z-index: 20000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: #fff; border-radius: 24px; padding: 28px; max-width: 440px; width: 100%; text-align: center; border: 4px solid var(--pink); animation: pop .3s ease; }
    .modal h3 { font-size: 1.6rem; margin-bottom: 10px; }
    .modal p { color: var(--mute); font-weight: bold; margin: 0 0 20px; }
    .toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); z-index: 30000; padding: 14px 22px; border-radius: 16px; font-weight: 900; box-shadow: 0 8px 20px rgba(0,0,0,.15); animation: pop .3s ease; max-width: 90vw; text-align: center; }
    .toast.ok { background: var(--mint); color: #fff; }
    .toast.err { background: var(--pink); color: #fff; }
    .pin-input { font-family: var(--display); font-size: 2.4rem; letter-spacing: 12px; text-align: center; width: 100%; max-width: 280px; padding: 14px; border: 3px solid var(--line); border-radius: 16px; outline: none; }
    .pin-input:focus { border-color: var(--lav); }
    .pin-input.bad { border-color: var(--pink); animation: shake .4s; }
    .linkrow { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-top: 10px; flex-wrap: wrap; }
    .linkrow code { font-size: .95rem; font-weight: bold; word-break: break-all; }

    @media (max-width: 640px) {
      .options { grid-template-columns: 1fr; }
      .lane { grid-template-columns: 100px 1fr 70px; }
      .podium-step { width: 100px; font-size: 1.5rem; }
      .timer-display { font-size: 1.6rem; padding: 6px 14px; }
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>
  <div id="app" class="container"></div>
  <div id="conn" class="conn local">🟠 Mode local</div>
  <button id="home-fab" onclick="location.hash=''" style="display:none; position:fixed; left:12px; bottom:12px; z-index:50; background:#fff; border:2px solid var(--line); border-radius:999px; padding:8px 14px; font-weight:900; font-size:.85rem; box-shadow:0 4px 10px rgba(0,0,0,.1);">🏠 Accueil</button>

  <script type="module">
    /* =========================================================================
       ⚙️ CONFIGURATION FIREBASE (pour jouer sur plusieurs appareils)
       -------------------------------------------------------------------------
       Collez ici l'objet "firebaseConfig" de votre projet Firebase.

       ========================================================================= */
    const FIREBASE_CONFIG = {

      storageBucket: "mission-detectives-226a8.firebasestorage.app",
      messagingSenderId: "569237528373",
      appId: "1:569237528373:web:2345f1bd0b575a2835f67c"
    };

    /* =========================================================================
       DONNÉES DU JEU
       ========================================================================= */
    const TEAMS = [
      { id: 0, name: "Brigade A", icon: "🍎", color: "var(--lav)" },
      { id: 1, name: "Brigade B", icon: "✈️", color: "var(--mint)" },
      { id: 2, name: "Brigade C", icon: "📚", color: "var(--peach)" }
    ];

    const TEACHERS = [
      "Fatima alreshedi",
      "Fatima albelucci",
      "Fatima mousa",
      "Hanan alazmi",
      "Mounira alshudokhi",
      "Mohra alshehab",
      "Esraa almousawi",
      "Reem alhamdan"
    ];

    const JUGE_NAME = "Mme. Thekryat Dashti";
    const MAX_PER_TEAM = 3;
    const ENQUETE_MINUTES = 15;         // durée de l'enquête (minuteur)
    const TOTAL_SEC = ENQUETE_MINUTES * 60;
    const PENALTY_SEC = 10;             // chaque erreur ajoute 10 secondes au temps de la brigade
    const AUTO_LETTERS_MAX = 7;         // 7 lettres gagnées en jouant, la 8e est donnée par la Juge
    const DEVINETTE_BONUS_SEC = 60;     // la devinette gagnée enlève 1 minute au temps

    const SAFE_LETTERS = ["C", "H", "O", "C", "O", "L", "A", "T"]; // le mot de passe : CHOCOLAT
    // Chaque brigade a son propre coffre : 1 lettre par étape réussie (6 phrases + la règle = 7 lettres).
    // La 8e lettre est réservée à la brigade qui gagne la QUESTION SURPRISE → elle remporte la partie.
    const SURPRISE_QUESTIONS = [
      { q: "Je mets des stylos dans ma trousse.", ans: "J'y en mets." },
      { q: "Je donne des bonbons aux enfants.", ans: "Je leur en donne." },
      { q: "J'emmène mes élèves au musée.", ans: "Je les y emmène." }
    ];

    const QUESTIONS = [
      [
        { src: "Je parle de mon projet.", say: "J'y parle.", isCoupable: true, fixOpts: ["J'en parle.", "Je lui parle.", "Je le parle."], fixAns: 0, explOpts: ["Parce que c'est une quantité.", "Parce qu'il y a « de » + une chose.", "Parce que c'est un lieu."], explAns: 1 },
        { src: "J'achète des pommes.", say: "J'en achète.", isCoupable: false, explOpts: ["Parce qu'il y a « à » + une chose.", "Parce que c'est un lieu.", "Parce que « des pommes » exprime une quantité."], explAns: 2 },
        { src: "Je bois du thé.", say: "Je le bois.", isCoupable: true, fixOpts: ["J'y bois.", "J'en bois.", "Je lui bois."], fixAns: 1, explOpts: ["Parce que « du » exprime une quantité.", "Parce que c'est un lieu.", "Parce qu'il y a « à » + une chose."], explAns: 0 },
        { src: "Je parle de ce problème.", say: "J'en parle.", isCoupable: false, explOpts: ["Parce que c'est une personne.", "Parce que c'est une quantité.", "Parce qu'il y a « de » + une chose ou une idée."], explAns: 2 },
        { src: "J'ai trois frères.", say: "J'en ai trois.", isCoupable: false, explOpts: ["Parce que « trois » est un nombre : une quantité.", "Parce que c'est un lieu.", "Parce qu'il y a « à » + une personne."], explAns: 0 },
        { src: "Je viens de Paris.", say: "J'y viens.", isCoupable: true, fixOpts: ["J'en viens.", "J'y vais.", "Je le viens."], fixAns: 0, explOpts: ["Parce qu'il y a « de » + un lieu.", "Parce qu'il y a « à » + un lieu.", "Parce que c'est une personne."], explAns: 0 }
      ],
      [
        { src: "Je vais à la bibliothèque.", say: "J'en vais.", isCoupable: true, fixOpts: ["J'y vais.", "Je la vais.", "Je lui vais."], fixAns: 0, explOpts: ["Parce qu'il y a « de » + une chose.", "Parce qu'il y a « à » + un lieu.", "Parce que c'est une quantité."], explAns: 1 },
        { src: "Je pense à mon examen.", say: "J'y pense.", isCoupable: false, explOpts: ["Parce que c'est un lieu.", "Parce qu'il y a « à » + une chose ou une idée.", "Parce que c'est une quantité."], explAns: 1 },
        { src: "Je vais chez le médecin.", say: "J'en vais.", isCoupable: true, fixOpts: ["J'y vais.", "Je le vais.", "Je lui vais."], fixAns: 0, explOpts: ["Parce que « chez… » indique un lieu.", "Parce qu'il y a « de » + une chose.", "Parce que c'est une quantité."], explAns: 0 },
        { src: "Je réponds à l'invitation.", say: "J'y réponds.", isCoupable: false, explOpts: ["Parce qu'il y a « à » + une chose.", "Parce qu'il y a « à » + une personne.", "Parce que c'est une quantité."], explAns: 0 },
        { src: "Je vais à Paris.", say: "J'y vais.", isCoupable: false, explOpts: ["Parce qu'il y a « de » + un lieu.", "Parce que c'est une quantité.", "Parce qu'il y a « à » + un lieu."], explAns: 2 },
        { src: "Je parle à Marie.", say: "J'y parle.", isCoupable: true, fixOpts: ["Je lui parle.", "J'en parle.", "Je la parle."], fixAns: 0, explOpts: ["Parce que Y remplace « à » + une chose, pas une personne !", "Parce que Y remplace toujours une personne.", "Parce que c'est un lieu."], explAns: 0 }
      ],
      [
        { src: "Je donne des cahiers aux élèves.", say: "Je en leur donne.", isCoupable: true, fixOpts: ["Je leur en donne.", "Je les leur donne.", "Je leur y donne."], fixAns: 0, explOpts: ["Parce que EN se place toujours au début.", "Parce que EN se place toujours en dernier.", "Parce que Y se place avant EN."], explAns: 1 },
        { src: "Je parle de mon problème à ma collègue.", say: "Je lui en parle.", isCoupable: false, explOpts: ["Parce que EN se place toujours en dernier.", "Parce que EN remplace une personne.", "Parce que LUI se place en dernier."], explAns: 0 },
        { src: "Il y a des élèves dans la classe.", say: "Il y en a.", isCoupable: false, explOpts: ["Parce que EN se place avant Y.", "Parce que Y et EN sont interchangeables.", "Parce que Y se place avant EN."], explAns: 2 },
        { src: "J'attends mes amis au café.", say: "Je y les attends.", isCoupable: true, fixOpts: ["Je les en attends.", "Je les y attends.", "J'y les attends."], fixAns: 1, explOpts: ["Parce que Y se place après l'autre pronom (LES), juste avant le verbe.", "Parce que Y se place toujours au début.", "Parce que Y se place après EN."], explAns: 0 },
        { src: "Je mets le livre sur la table.", say: "Je le y mets.", isCoupable: true, fixOpts: ["Je l'y mets.", "Je y le mets.", "Je lui y mets."], fixAns: 0, explOpts: ["Parce que Y devient « y' ».", "Parce que « le / la » devient « l' » devant Y ou EN.", "Parce qu'on enlève le pronom « le »."], explAns: 1 },
        { src: "Je donne des fleurs à Marie.", say: "Je les lui donne.", isCoupable: true, fixOpts: ["Je lui en donne.", "Je les y donne.", "Je en lui donne."], fixAns: 0, explOpts: ["Parce que Marie est un lieu (Y).", "Parce que « des fleurs » est une quantité, donc on utilise EN.", "Parce qu'il n'y a pas de quantité."], explAns: 1 }
      ]
    ];

    const RULES = [
      { q: "D'après toutes vos explications, que remplace le pronom EN ?", opts: ["Un lieu (ex. : à Paris)", "Un complément introduit par « de » ou une quantité", "Une personne avec « à » (ex. : à Marie)"], ans: 1, memo: "EN remplace un complément introduit par « de » (chose, lieu) ou une quantité." },
      { q: "D'après toutes vos explications, que remplace le pronom Y ?", opts: ["Une quantité ou un nombre", "Un complément introduit par « de »", "Un lieu, ou une chose / idée introduite par « à »"], ans: 2, memo: "Y remplace un lieu, ou un complément de chose ou d'idée introduit par « à ». Attention : pour les personnes, on utilise LUI / LEUR !" },
      { q: "D'après toutes vos explications, quand Y ou EN accompagnent un autre pronom, où se placent-ils ?", opts: ["Au début, avant l'autre pronom", "Toujours en dernier, juste avant le verbe (et Y avant EN)", "N'importe où"], ans: 1, memo: "Y et EN se placent toujours en dernier, juste avant le verbe. Ensemble, c'est Y avant EN (ex. : Il y en a)." }
    ];

    /* =========================================================================
       ÉTAT DU JEU + SYNCHRONISATION
       ========================================================================= */
    const STATE_KEY = "mission_detectives_v8_state";

    // Ordre aléatoire d'apparition des lettres (différent pour chaque brigade)
    function randomOrder() {
      const a = [0, 1, 2, 3, 4, 5, 6, 7];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }
    const FALLBACK_ORDERS = [[3, 0, 6, 1, 7, 4, 2, 5], [5, 2, 0, 7, 3, 6, 1, 4], [1, 6, 4, 0, 5, 2, 7, 3]];
    function getDefaultState() {
      return {
        teams: [0, 1, 2].map(() => ({ score: 0, qIndex: 0, state: "intro", helpRequested: false, ruleUnlocked: false, errors: 0, adjust: 0, finishElapsed: null })),
        tirageCounts: [0, 0, 0],
        assignments: {},
        lettersRevealed: 0,
        letterOrder: [0, 1, 2].map(() => randomOrder().join('')), // texte "30617425" : Firestore refuse les tableaux imbriqués
        showDevinette: false,
        surprise: { active: false, qIndex: 0, answers: [], winner: null, winnerAnswer: null },
        showPodium: false,
        timer: { isRunning: false, remaining: ENQUETE_MINUTES * 60, lastStart: 0 }
      };
    }

    function readLocal() {
      try {
        const raw = localStorage.getItem(STATE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return getDefaultState();
    }
    function writeLocal(s) {
      try { localStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch (e) {}
    }

    let localState = readLocal();
    let online = false;
    let fb = null;          // modules Firebase (chargés seulement si configuré)
    let db = null, stateDocRef = null;

    function setConn(isOnline) {
      online = isOnline;
      const el = document.getElementById('conn');
      el.className = 'conn ' + (isOnline ? 'online' : 'local');
      el.textContent = isOnline ? '🟢 Synchronisé' : '🟠 Mode local (cet appareil seulement)';
    }

    // Plusieurs onglets sur le même appareil restent synchronisés en mode local
    window.addEventListener('storage', (e) => {
      if (!online && e.key === STATE_KEY && e.newValue) {
        try { localState = JSON.parse(e.newValue); render(); } catch (err) {}
      }
    });

    async function initFirebase() {
      if (Object.keys(FIREBASE_CONFIG).length === 0) { setConn(false); return; }
      try {
        const [appMod, authMod, fsMod] = await Promise.all([
          import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"),
          import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"),
          import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")
        ]);
        fb = { ...authMod, ...fsMod };
        const app = appMod.initializeApp(FIREBASE_CONFIG);
        const auth = fb.getAuth(app);
        db = fb.getFirestore(app);
        stateDocRef = fb.doc(db, 'missionDetectives', 'gamestate');
        await fb.signInAnonymously(auth);
        subscribe();
        // si la connexion se coupe (téléphone en veille, WhatsApp…), on se reconnecte tout seul
        document.addEventListener('visibilitychange', () => { if (!document.hidden && !online) subscribe(); });
        window.addEventListener('online', () => { if (!online) subscribe(); });
      } catch (e) {
        console.error("Firebase indisponible, passage en mode local :", e);
        setConn(false);
      }
    }

    let unsub = null, retryTimer = null;
    function subscribe() {
      if (!stateDocRef) return;
      try { unsub && unsub(); } catch (e) {}
      clearTimeout(retryTimer);
      unsub = fb.onSnapshot(stateDocRef, (snap) => {
        if (snap.exists()) {
          localState = snap.data();
          writeLocal(localState);
          setConn(true);
          render();
        } else {
          fb.setDoc(stateDocRef, getDefaultState());
        }
      }, (err) => {
        console.error("Sync error:", err);
        setConn(false);
        retryTimer = setTimeout(subscribe, 3000);
      });
    }

    window.getState = () => localState;

    // Toute modification passe ici : en ligne, une transaction évite que deux
    // appareils s'écrasent mutuellement leurs points.
    async function mutate(fn) {
      if (online && stateDocRef) {
        try {
          await fb.runTransaction(db, async (tx) => {
            const snap = await tx.get(stateDocRef);
            const s = snap.exists() ? snap.data() : getDefaultState();
            fn(s);
            tx.set(stateDocRef, s);
          });
          return;
        } catch (e) {
          console.error("Transaction échouée :", e);
          showToast('⚠️ Connexion instable : action non synchronisée', false);
        }
      }
      const s = JSON.parse(JSON.stringify(localState));
      fn(s);
      localState = s;
      writeLocal(s);
      render();
    }

    /* =========================================================================
       CODES D'ACCÈS
       Juge : 2580 · Animatrice (accès total) : 7319
       (seules les empreintes SHA-256 sont dans le code)
       ========================================================================= */
    const PIN_HASH = {
      juge: "96919b3baea5ba0193cf3f271d819e2139663a471a95dd34e56a6a0f9b51b8a5",
      admin: "ca5fe96404b8a2aadbc6770c9713c9518a530dacbd634a6e9bb6a479ecc7d0ac"
    };
    async function sha256(txt) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
    function isAdmin() { return lsGet('md_role_admin') === '1'; }
    function isJuge() { return isAdmin() || lsGet('md_role_juge') === '1'; }

    window.submitPin = async function (target) {
      const inp = document.getElementById('pin');
      const val = (inp?.value || '').trim();
      if (!val) return;
      const h = await sha256('md-salt-' + val);
      if (h === PIN_HASH.admin) {
        lsSet('md_role_admin', '1');
        showToast('👑 Bienvenue ! Accès total activé.');
        if (target === 'any') location.hash = 'admin';
        render();
      } else if (h === PIN_HASH.juge && target !== 'admin_only') {
        lsSet('md_role_juge', '1');
        showToast('⚖️ Bienvenue, Madame la Juge !');
        location.hash = 'juge';
        render();
      } else {
        inp.classList.remove('bad'); void inp.offsetWidth; inp.classList.add('bad');
        inp.value = '';
        showToast('Code incorrect', false);
      }
    };
    window.lockDevice = function () {
      lsSet('md_role_admin', null); lsSet('md_role_juge', null);
      showToast('🔒 Appareil verrouillé');
      location.hash = '';
      render();
    };

    function viewPin(target) {
      const title = target === 'admin_only' ? 'Accès réservé à l\'animatrice' : 'Accès réservé';
      return `
        <div class="card" style="max-width:480px; margin:60px auto; text-align:center; border-color:var(--lav);">
          <div style="font-size:3.5rem;">🔐</div>
          <h2 style="font-size:2rem; margin:10px 0;">${title}</h2>
          <p style="color:var(--mute); font-weight:bold;">Entrez votre code d'accès</p>
          <input id="pin" class="pin-input" type="password" inputmode="numeric" maxlength="8" autocomplete="off"
                 onkeydown="if(event.key==='Enter') submitPin('${target}')">
          <div class="flex-center">
            <button class="btn-action" style="background:var(--lav); font-size:1.2rem; padding:14px 34px;" onclick="submitPin('${target}')">Entrer</button>
          </div>
          <div class="flex-center"><button class="btn-action" style="background:var(--line); color:var(--ink); font-size:.95rem;" onclick="location.hash=''">← Retour</button></div>
        </div>`;
    }

    // Modale de confirmation (remplace confirm() bloqué dans WhatsApp / Instagram)
    function askConfirm(title, text, okLabel = 'Oui, confirmer') {
      return new Promise((resolve) => {
        const bg = document.createElement('div');
        bg.className = 'modal-bg';
        bg.innerHTML = `
          <div class="modal">
            <h3>${title}</h3>
            <p>${text}</p>
            <div class="flex-center" style="margin-top:0;">
              <button class="btn-action" style="background:var(--line); color:var(--ink);" data-a="no">Annuler</button>
              <button class="btn-action" style="background:var(--pink);" data-a="yes">${okLabel}</button>
            </div>
          </div>`;
        bg.addEventListener('click', (e) => {
          const a = e.target.dataset?.a;
          if (a || e.target === bg) { bg.remove(); resolve(a === 'yes'); }
        });
        document.body.appendChild(bg);
      });
    }
    function showToast(msg, ok = true) {
      const t = document.createElement('div');
      t.className = 'toast ' + (ok ? 'ok' : 'err');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2600);
    }
    window.showToast = showToast;

    // Réinitialisation complète (écriture directe, sans transaction)
    async function resetAll() {
      const fresh = getDefaultState();
      if (online && stateDocRef) {
        try { await fb.setDoc(stateDocRef, fresh); }
        catch (e) { console.error(e); showToast('Erreur de connexion : réessayez', false); return false; }
      }
      localState = fresh; writeLocal(fresh); render();
      return true;
    }
    window.resetSession = async function () {
      if (!isAdmin()) { showToast('Réservé à l\'animatrice', false); return; }
      const ok = await askConfirm('🔄 Nouvelle partie ?', 'Les scores, le chrono, le coffre et le tirage seront effacés sur tous les appareils.', 'Oui, tout effacer');
      if (!ok) return;
      if (await resetAll()) showToast('✅ Partie réinitialisée sur tous les appareils');
    };

    /* =========================================================================
       CLASSEMENT AU TEMPS
       La brigade qui termine (6 phrases + la règle) le plus vite gagne.
       Temps final = temps réel + 10 s par erreur − bonus de la Juge.
       ========================================================================= */
    const TOTAL_STEPS = 7; // 6 phrases + la règle
    function elapsedNow(st) { return Math.max(0, TOTAL_SEC - getTimerRemaining(st)); }
    function stepsDone(ts) { return Math.min(6, ts.qIndex) + (ts.ruleUnlocked ? 1 : 0); }
    function teamTime(st, i) {
      const ts = st.teams[i];
      const base = ts.finishElapsed != null ? ts.finishElapsed : elapsedNow(st);
      return Math.max(0, base + (ts.errors || 0) * PENALTY_SEC + (ts.adjust || 0));
    }
    function ranking(st) {
      const w = surpriseOf(st).winner;
      return [0, 1, 2].sort((a, b) => {
        if (w === a) return -1;
        if (w === b) return 1;
        const A = st.teams[a], B = st.teams[b];
        if (A.ruleUnlocked !== B.ruleUnlocked) return A.ruleUnlocked ? -1 : 1;
        if (!A.ruleUnlocked && stepsDone(A) !== stepsDone(B)) return stepsDone(B) - stepsDone(A);
        return teamTime(st, a) - teamTime(st, b);
      });
    }
    function surpriseOf(st) { return st.surprise || { active: false, qIndex: 0, answers: [], winner: null }; }
    function teamLetters(st, i) {
      const n = Math.min(7, stepsDone(st.teams[i])) + (surpriseOf(st).winner === i ? 1 : 0);
      return n;
    }
    function orderOf(st, i) {
      const raw = st.letterOrder && st.letterOrder[i];
      const o = typeof raw === 'string' ? raw.split('').map(Number) : raw;
      return (Array.isArray(o) && o.length === 8 && new Set(o).size === 8) ? o : FALLBACK_ORDERS[i];
    }
    function lettersHtml(st, i, big = false) {
      const steps = Math.min(7, stepsDone(st.teams[i]));
      const won = surpriseOf(st).winner === i;
      const order = orderOf(st, i);
      return SAFE_LETTERS.map((l, k) => {
        const rank = order.indexOf(k);      // à quelle étape cette case s'ouvre
        const last = rank === 7;            // la case de la question surprise
        const on = last ? won : rank < steps;
        if (big) return `<div class="letter-slot ${on ? 'revealed' : ''}" style="${last && !on ? 'border-color:var(--pink);' : ''}">${on ? l : (last ? '⚡' : '?')}</div>`;
        return on ? l : (last ? '⚡' : '_');
      }).join(big ? '' : ' ');
    }
    function normAns(t) {
      return String(t || '').toLowerCase().replace(/[’`´]/g, "'").normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z']/g, ' ').replace(/\s+/g, ' ').replace(/ ?' ?/g, "'").trim();
    }

    function adjLabel(ts) {
      const pen = (ts.errors || 0) * PENALTY_SEC, adj = ts.adjust || 0;
      const parts = [];
      if (pen) parts.push(`+${pen} s erreurs`);
      if (adj < 0) parts.push(`${adj} s bonus`);
      if (adj > 0) parts.push(`+${adj} s Juge`);
      return parts.join(' · ');
    }

    /* =========================================================================
       ROUTAGE
       ========================================================================= */
    function getRoute() {
      const h = location.hash.replace('#', '');
      if (h === 'ecran') return { view: 'screen' };
      if (h === 'juge') return { view: 'referee' };
      if (h === 'tirage') return { view: 'tirage' };
      if (h === 'admin') return { view: 'admin' };
      if (h.startsWith('brigade-')) {
        const id = parseInt(h.split('-')[1], 10);
        if (id >= 0 && id <= 2) return { view: 'team', id };
      }
      return { view: 'login' };
    }
    window.addEventListener('hashchange', () => { render(); setTimeout(() => document.getElementById('pin')?.focus(), 50); });

    /* =========================================================================
       AFFICHAGE
       ========================================================================= */
    const $ = (s) => document.querySelector(s);
    const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let isRolling = false;

    let prevDevinette = null;
    function render() {
      const st0 = getState();
      const sAct = !!surpriseOf(st0).active;
      if (prevDevinette === false && sAct) { try { playSound('reveal'); setTimeout(() => playSound('bonus'), 300); } catch (e) {} }
      prevDevinette = sAct;
      if (isRolling) return; // ne pas interrompre l'animation du dé
      const route = getRoute();
      const app = $('#app');
      const fab = document.getElementById('home-fab'); if (fab) fab.style.display = route.view === 'login' ? 'none' : 'block';
      if (route.view === 'login') app.innerHTML = viewLogin();
      else if (route.view === 'tirage') app.innerHTML = viewTirage();
      else if (route.view === 'screen') app.innerHTML = isAdmin() ? viewScreen() : viewPin('admin_only');
      else if (route.view === 'referee') app.innerHTML = isJuge() ? viewReferee() : viewPin('juge');
      else if (route.view === 'admin') app.innerHTML = isAdmin() ? viewAdmin() : viewPin('any');
      else if (route.view === 'team') app.innerHTML = viewTeam(route.id);
    }

    function fmtTime(sec) {
      return Math.floor(sec / 60).toString().padStart(2, '0') + ':' + (sec % 60).toString().padStart(2, '0');
    }

    // 1. ACCUEIL
    function viewLogin() {
      return `
        <div style="text-align:center; padding: 40px 0;">
          <span class="eyebrow">Mission Détectives</span>
          <h1 style="font-size: 3rem;">Choisissez votre rôle</h1>
          <div class="flex-center" style="margin:20px 0;">
            <button class="btn-action" style="background:var(--pink); font-size:1.5rem; padding:20px 40px; border-radius:24px; width:100%; max-width:600px; box-shadow:0 8px 0 #b92b6a;" onclick="location.hash='tirage'">
              🎲 TIRAGE AU SORT DES ÉQUIPES
            </button>
          </div>
          <p style="color:var(--mute); font-weight:bold; margin-top:20px;">Ou accédez directement aux écrans :</p>
          <div class="grid-login">
            ${TEAMS.map(t => `
              <button class="btn-login" style="border-color:${t.color};" onclick="location.hash='brigade-${t.id}'">
                <span class="icon">${t.icon}</span> ${t.name}
              </button>`).join('')}
          </div>
          <div class="flex-center" style="margin-top:50px;">
            ${isAdmin()
              ? `<button class="btn-action" style="background:var(--ink);" onclick="location.hash='admin'">👑 Mon tableau de bord</button>`
              : isJuge()
                ? `<button class="btn-action" style="background:var(--sun); color:#6b4a00;" onclick="location.hash='juge'">⚖️ Tablette de la Juge</button>`
                : `<button class="btn-action" style="background:var(--line); color:var(--mute); font-size:.95rem;" onclick="location.hash='admin'">🔐 Accès réservé</button>`}
          </div>
        </div>`;
    }

    // 2. TIRAGE AU SORT
    function viewTirage() {
      const state = getState();
      const unassigned = TEACHERS.filter(t => state.assignments[t] === undefined);
      const allFull = state.tirageCounts.every(c => c >= MAX_PER_TEAM);

      let selectHtml;
      if (allFull) {
        selectHtml = `<div style="margin-bottom:20px; color:var(--mint); font-weight:bold; font-size:1.5rem;">Toutes les brigades sont complètes ! 🎉</div>`;
      } else {
        selectHtml = `
          <div style="margin-bottom:20px;">
            <label style="display:block; font-weight:bold; margin-bottom:10px; color:var(--mute);">Sélectionnez votre nom :</label>
            <select id="teacher-select" onchange="toggleOther()">
              ${unassigned.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('')}
              <option value="__other__">➕ Autre nom…</option>
            </select>
            <div id="other-wrap" style="display:${unassigned.length === 0 ? 'block' : 'none'}; margin-top:10px;">
              <input id="other-name" class="name-input" placeholder="Écrivez votre nom" maxlength="40">
            </div>
          </div>
          <button id="btn-roll" class="btn-action" style="background:var(--pink); font-size:1.5rem; padding:15px 40px; box-shadow:0 6px 0 #b92b6a;" onclick="rollDice()">Lancer le dé !</button>`;
      }

      const membersOf = (i) => Object.keys(state.assignments).filter(k => state.assignments[k] === i);

      return `
        <div class="top-bar" style="margin-bottom:20px;">
          <span>🎲 Répartition des équipes</span>
          <button class="btn-action" onclick="location.hash=''">Retour</button>
        </div>
        <div class="card" style="text-align:center; max-width:640px; margin:20px auto; border-color:var(--lav)">
          <span class="eyebrow">Tirage au sort</span>
          <h2 style="font-size:2.2rem; margin-bottom:20px;">Quelle sera votre brigade ?</h2>
          ${selectHtml}
          <div id="spinner-box" class="spinner-box">
            <span style="font-size:5rem;">🎲</span>
            <div class="spinner-text" style="color:var(--mute)">Prête pour le tirage ?</div>
          </div>
          <div style="margin-top:40px; border-top:2px dashed var(--line); padding-top:20px;">
            <p style="color:var(--mute); font-weight:bold; margin-bottom:15px;">Membres assignés :</p>
            <div style="display:flex; justify-content:center; gap:15px; flex-wrap:wrap;">
              ${TEAMS.map((t, i) => `
                <div style="background:${t.color}22; border:2px solid ${t.color}; padding:10px 15px; border-radius:12px; font-weight:bold; color:${t.color}; min-width:150px;">
                  ${t.icon} ${state.tirageCounts[i]}/${MAX_PER_TEAM}
                  <div style="font-size:.85rem; color:var(--ink); margin-top:6px;">${membersOf(i).map(esc).join('<br>') || '—'}</div>
                </div>`).join('')}
            </div>
            ${isAdmin() ? `<div class="flex-center">
              <button class="btn-action" style="background:var(--line); color:var(--ink); font-size:.9rem;" onclick="resetTirage()">Réinitialiser le tirage</button>
            </div>` : ''}
          </div>
        </div>`;
    }

    // 3. ÉCRAN GÉANT
    function soundBtn() {
      const on = soundOn();
      return `<button class="btn-action" style="background:${on ? 'var(--mint)' : 'var(--line)'}; color:${on ? '#fff' : 'var(--ink)'}; font-size:.95rem;" onclick="toggleSound()">${on ? '🔊 Son activé' : '🔇 Son coupé'}</button>`;
    }

    function viewScreen() {
      const state = getState();
      const rem = getTimerRemaining(state);
      const order = ranking(state);
      const medals = ['🥇', '🥈', '🥉'];

      let html = `
        <div class="top-bar" style="flex-wrap:wrap;">
          <span style="font-size:1.5rem">📺 ÉCRAN DU TRIBUNAL</span>
          <div class="timer-display timer-text ${rem <= 60 && rem > 0 ? 'warning' : ''}">${fmtTime(rem)}</div>
          <div style="display:flex; gap:8px;">${soundBtn()}<button class="btn-action" onclick="location.hash='admin'">Quitter</button></div>
        </div>`;

      if (state.showPodium) {
        const p = order.map(i => ({ ...TEAMS[i], ts: state.teams[i], time: teamTime(state, i) }));
        const label = (x) => (surpriseOf(state).winner === x.id ? '⚡ Question surprise · ' : '') + (x.ts.ruleUnlocked ? `⏱ ${fmtTime(x.time)}` : `${stepsDone(x.ts)}/${TOTAL_STEPS} étapes`);
        return html + `
          <div class="card" style="margin-top:20px; text-align:center; border-color:var(--gold); background:var(--sun-s);">
            <h1 style="font-size:3rem; color:var(--gold); margin-bottom:10px;">🏆 LE PALMARÈS !</h1>
            <p style="font-size:1.2rem;">La brigade qui a résolu la question surprise remporte l'enquête. Félicitations à toutes !</p>
            <div class="podium-container">
              <div class="podium-step podium-2"><span class="team-name">${p[1].icon} ${p[1].name}</span><span class="team-score">${label(p[1])}</span>2</div>
              <div class="podium-step podium-1"><span class="team-name">${p[0].icon} ${p[0].name}</span><span class="team-score">${label(p[0])}</span>1</div>
              <div class="podium-step podium-3"><span class="team-name">${p[2].icon} ${p[2].name}</span><span class="team-score">${label(p[2])}</span>3</div>
            </div>
          </div>`;
      }

      html += `
        <div class="card" style="margin-top:20px;">
          ${soundOn() && (!audioCtx || audioCtx.state !== 'running') ? `<div style="background:var(--pink-s); color:var(--berry); font-weight:900; padding:10px 14px; border-radius:12px; margin-bottom:12px; cursor:pointer;" onclick="initAudio(); render();">🔈 Touchez ici une fois pour activer le son du chrono</div>` : ''}
          <span class="eyebrow">Course contre la montre</span>
          <h2>Classement en direct</h2>
          <p style="color:var(--mute); font-weight:bold; margin:6px 0 0;">Classement provisoire au temps (chaque erreur = +${PENALTY_SEC} s) · la question surprise désigne la gagnante !</p>
          <div class="track">
            ${order.map((i, rank) => {
              const t = TEAMS[i], ts = state.teams[i];
              const pct = Math.max(4, (stepsDone(ts) / TOTAL_STEPS) * 100);
              return `
                <div class="lane">
                  <span class="lane-name" style="color:${t.color}">${medals[rank]} ${t.icon} ${t.name}</span>
                  <div class="road"><div class="fill ${rank === 0 && stepsDone(ts) > 0 ? 'glow-effect' : ''}" style="width:${pct}%; background:${t.color}"></div>
                    <span style="position:absolute; left:14px; top:50%; transform:translateY(-50%); font-weight:900; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.4);">${ts.ruleUnlocked ? '✅ Terminé' : stepsDone(ts) + '/' + TOTAL_STEPS}</span></div>
                  <span class="score team-time" data-team="${i}" style="font-size:1.5rem;">${fmtTime(teamTime(state, i))}</span>
                </div>`;
            }).join('')}
          </div>
        </div>`;

      const sp = surpriseOf(state);
      if (sp.active || sp.winner !== null) {
        const qq = SURPRISE_QUESTIONS[sp.qIndex];
        html += sp.winner !== null ? `
          <div class="devinette-box">
            <h2 style="font-size:2.4rem; margin-bottom:8px;">🏆 ${TEAMS[sp.winner].icon} ${TEAMS[sp.winner].name} a résolu la question surprise !</h2>
            <p style="font-size:1.6rem; font-weight:900; margin:0;">« ${esc(qq.q)} » → « ${esc(sp.winnerAnswer || qq.ans)} »</p>
            <p style="font-size:1.2rem; margin:8px 0 0;">Elle gagne la dernière lettre… et le coffre !</p>
          </div>` : `
          <div class="devinette-box">
            <h2 style="font-size:2.5rem; margin-bottom:10px;">⚡ QUESTION SURPRISE !</h2>
            <p style="font-size:1.3rem; font-weight:900; margin:0 0 6px;">Remplacez les deux compléments par deux pronoms :</p>
            <p style="font-size:2.2rem; font-weight:900; margin:0;">« ${esc(qq.q)} »</p>
            <p style="font-size:1.1rem; margin:10px 0 0;">✍️ Écrivez votre réponse sur votre appareil · ${sp.answers.length} réponse(s) reçue(s)</p>

      }

      html += `
        <div class="safe-container">
          <h2 style="color:var(--gold); font-size:2.3rem; margin-bottom:6px;">🔐 LES COFFRES-FORTS</h2>

            <div style="display:flex; align-items:center; gap:14px; justify-content:center; margin-top:16px; flex-wrap:wrap;">
              <span style="font-weight:900; min-width:130px; text-align:right;">${t.icon} ${t.name}</span>
              <div class="safe-letters" style="margin-top:0;">${lettersHtml(state, i, true)}</div>

    }

    // Bloc « question surprise » de la Juge
    function surpriseJudgeHtml(state) {
      const sp = surpriseOf(state);
      const head = `<div style="margin-top:30px; padding-top:20px; border-top:3px solid var(--pink);">
            <h3 style="text-align:center; color:var(--pink); font-size:1.6rem;">⚡ La question surprise</h3>
            <p style="text-align:center; font-size:.95rem; color:var(--mute); font-weight:bold;">Elle apparaît sur les 8 appareils. Validez la première bonne réponse : sa brigade gagne la dernière lettre et remporte la partie.</p>`;
      if (sp.winner !== null) {
        return head + `<div class="devinette-box" style="padding:18px;"><h3>🏆 ${TEAMS[sp.winner].name} a gagné !</h3><p style="margin:6px 0 0; font-weight:bold;">« ${esc(sp.winnerAnswer || '')} »</p></div>
          <div class="flex-center"><button class="btn-action" style="background:var(--line); color:var(--ink); font-size:.9rem;" onclick="cancelSurprise()">Annuler la victoire</button></div></div>`;
      }
      if (!sp.active) {
        return head + `<div class="fix-options">
            ${SURPRISE_QUESTIONS.map((qq, k) => `
              <button class="fix-btn" style="border-color:var(--pink);" onclick="launchSurprise(${k})">
                ⚡ Lancer : « ${esc(qq.q)} »<br><small style="color:var(--mint);">Réponse attendue : ${esc(qq.ans)}</small>
              </button>`).join('')}
          </div></div>`;
      }
      const qq = SURPRISE_QUESTIONS[sp.qIndex];
      const answers = [...sp.answers].sort((x, y) => x.at - y.at);
      const t0 = answers.length ? answers[0].at : 0;
      return head + `
          <div class="devinette-box" style="padding:16px;">
            <p style="margin:0; font-weight:900; font-size:1.2rem;">« ${esc(qq.q)} »</p>
            <p style="margin:6px 0 0;">✅ Réponse attendue : <b>${esc(qq.ans)}</b></p>
          </div>
          <h3 style="margin-top:16px;">📨 Réponses reçues (${answers.length}) — dans l'ordre d'arrivée</h3>
          <div class="vip-grid">
            ${answers.length ? answers.map((a, k) => {
              const t = TEAMS[a.team];
              const match = normAns(a.text) === normAns(qq.ans);
              return `
                <div class="vip-team" style="border-color:${match ? 'var(--mint)' : 'var(--line)'};">
                  <div>
                    <div style="font-weight:900; color:${t.color};">${k + 1}. ${t.icon} ${t.name} · ${esc(a.name)} <small style="color:var(--mute);">+${Math.round((a.at - t0) / 1000)} s</small></div>
                    <div style="font-size:1.3rem; font-weight:900; margin-top:4px;">« ${esc(a.text)} »</div>
                    ${match ? `<div style="color:var(--mint); font-weight:900; font-size:.85rem;">💡 Identique à la réponse attendue</div>` : ''}
                  </div>
                  <button class="vip-btn" style="background:var(--mint); color:#fff; font-size:1rem; padding:10px 16px;" onclick="validateSurprise(${a.team}, ${k})">✅ Valider</button>

            }).join('') : `<p style="color:var(--mute); font-weight:bold; text-align:center;">En attente des réponses…</p>`}
          </div>
          <div class="flex-center"><button class="btn-action" style="background:var(--line); color:var(--ink); font-size:.9rem;" onclick="cancelSurprise()">Fermer la question</button></div>
        </div>`;
    }

    // 4. TABLETTE DE LA JUGE
    function viewReferee() {
      const state = getState();
      const rem = getTimerRemaining(state);

      return `
        <div class="top-bar" style="background:var(--sun-s); border-color:var(--sun); flex-wrap:wrap;">

        </div>
        <div class="card" style="margin-top:20px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px;">

          <div class="vip-grid">
            ${TEAMS.map((t, i) => {
              const ts = state.teams[i];
              return `
                <div class="vip-team">
                  <div>
                    <h3 style="color:${t.color};">${t.icon} ${t.name} · <span class="team-time" data-team="${i}">${fmtTime(teamTime(state, i))}</span></h3>
                    <span style="font-weight:bold; color:var(--mute);">Étapes : ${stepsDone(ts)}/${TOTAL_STEPS} · Erreurs : ${ts.errors || 0}${ts.ruleUnlocked ? ' · ✅ Terminé' : ''}${adjLabel(ts) ? ' · ' + adjLabel(ts) : ''}</span>
                    ${ts.helpRequested ? `<div class="alert-badge">🚨 Demande d'aide !</div>` : ''}
                  </div>
                  <div class="vip-controls">

                    <button class="vip-btn bonus" onclick="addTime(${i}, -30)" style="background:var(--pink)">⭐⭐ −30 s</button>
                    <button class="vip-btn bonus" onclick="addTime(${i}, 15)" style="background:var(--mute)">⚠️ +15 s</button>
                    ${ts.helpRequested ? `<button class="vip-btn" style="background:var(--line);" onclick="clearHelp(${i})">Aide traitée</button>` : ''}
                  </div>
                </div>`;
            }).join('')}
          </div>

          ${surpriseJudgeHtml(state)}

          <div style="margin-top:30px; padding-top:20px; border-top:2px solid var(--gold);">
            <h3 style="text-align:center; color:var(--gold);">🏆 Clôture de l'enquête</h3>
            <button class="vip-btn letter" style="background:var(--ink); color:#fff; border-color:var(--ink);" onclick="togglePodium()">
              ${state.showPodium ? "Retour au tribunal" : "🎉 Annoncer le palmarès (podium) !"}
            </button>
          </div>

          ${isAdmin() ? `
          <div style="margin-top:30px; padding-top:20px; border-top:2px dashed var(--line); text-align:center;">
            <button class="btn-action" style="background:var(--ink);" onclick="location.hash='admin'">👑 Retour à mon tableau de bord</button>
          </div>` : `
          <div style="margin-top:30px; text-align:center;">
            <button class="btn-action" style="background:var(--line); color:var(--mute); font-size:.9rem;" onclick="lockDevice()">🔒 Verrouiller cette tablette</button>
          </div>`}
        </div>`;
    }

    // 6. TABLEAU DE BORD DE L'ANIMATRICE
    window.copyLink = function (txt) {
      const done = () => showToast('📋 Lien copié !');
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(done, () => window.prompt('Copiez ce lien :', txt));
      else window.prompt('Copiez ce lien :', txt);
    };
    function viewAdmin() {
      const state = getState();
      const base = location.origin + location.pathname;
      const rem = getTimerRemaining(state);
      const links = [
        ['🎲 Tirage (pour les 8 enseignantes)', base + '#tirage'],
        ['⚖️ Tablette de la Juge (code 2580)', base + '#juge'],

      return `
        <div class="top-bar" style="flex-wrap:wrap; border-color:var(--ink);">
          <span style="font-size:1.4rem;">👑 Tableau de bord de l'animatrice</span>
          <div class="timer-display timer-text ${rem <= 60 && rem > 0 ? 'warning' : ''}" style="font-size:1.4rem; padding:5px 14px;">${fmtTime(rem)}</div>
          <div style="display:flex; gap:8px;"><button class="btn-action" style="background:var(--line); color:var(--ink);" onclick="location.hash=''">🏠 Accueil</button><button class="btn-action" style="background:var(--line); color:var(--ink);" onclick="lockDevice()">🔒 Verrouiller</button></div>
        </div>

        <div class="grid-login">
          <button class="btn-login" style="border-color:var(--ink);" onclick="location.hash='ecran'"><span class="icon">📺</span> Écran géant (projecteur)</button>
          <button class="btn-login" style="border-color:var(--sun);" onclick="location.hash='juge'"><span class="icon">⚖️</span> Tablette de la Juge</button>
          <button class="btn-login" style="border-color:var(--pink);" onclick="location.hash='tirage'"><span class="icon">🎲</span> Tirage au sort</button>
        </div>

        <div class="card">
          <span class="eyebrow">En direct</span>
          <h2>Progression des brigades</h2>
          <div class="vip-grid">
            ${ranking(state).map((i, r) => {
              const t = TEAMS[i], ts = state.teams[i];
              return `
                <div class="vip-team">
                  <div>
                    <h3 style="color:${t.color};">${['🥇','🥈','🥉'][r]} ${t.icon} ${t.name} · <span class="team-time" data-team="${i}">${fmtTime(teamTime(state, i))}</span></h3>
                    <span style="font-weight:bold; color:var(--mute);">Étapes : ${stepsDone(ts)}/${TOTAL_STEPS} · Erreurs : ${ts.errors || 0}${ts.ruleUnlocked ? ' · ✅ Terminé' : ''}</span>
                    <div style="font-size:.9rem; margin-top:4px;">👥 ${members(i)}</div>

                </div>`;
            }).join('')}
          </div>
        </div>

        <div class="card">
          <span class="eyebrow">À partager</span>
          <h2>Les liens</h2>
          <p style="color:var(--mute); font-weight:bold;">Envoyez le lien du tirage aux enseignantes, et le lien de la Juge (avec son code) à la cheffe.</p>
          ${links.map(([label, url]) => `
            <div class="linkrow">
              <div><div style="font-weight:900;">${label}</div><code>${esc(url)}</code></div>
              <button class="btn-action" style="background:var(--lav); font-size:.95rem; padding:10px 18px;" onclick="copyLink('${url}')">📋 Copier</button>
            </div>`).join('')}
        </div>

        <div class="card" style="border-color:var(--pink); text-align:center;">
          <h2 style="color:var(--pink);">🔄 Nouvelle partie</h2>
          <p style="color:var(--mute); font-weight:bold;">Efface les scores, le chrono, le coffre et le tirage sur tous les appareils.</p>
          <button class="btn-action" style="background:var(--pink); font-size:1.2rem; padding:14px 30px;" onclick="resetSession()">Tout recommencer à zéro</button>
        </div>`;
    }

    // Bloc « question surprise » sur les appareils des enseignantes
    function myName() { return lsGet('md_me') || ''; }
    function surpriseTeamHtml(state, tId) {
      const sp = surpriseOf(state);
      if (sp.winner !== null) {
        const won = sp.winner === tId;
        return `
          <div class="devinette-box" style="margin-top:20px; ${won ? '' : 'background:var(--line); color:var(--ink); border-color:var(--mute);'}">
            <h2 style="font-size:1.9rem;">${won ? '🏆 Bravo ! Votre brigade a gagné la question surprise !' : `⚡ ${TEAMS[sp.winner].icon} ${TEAMS[sp.winner].name} a été la plus rapide !`}</h2>
            <p style="font-size:1.2rem; font-weight:900; margin:6px 0 0;">« ${esc(sp.winnerAnswer || '')} »</p>
          </div>`;
      }
      if (!sp.active) return '';
      const qq = SURPRISE_QUESTIONS[sp.qIndex];
      const me = myName();
      const mine = sp.answers.find(a => a.name === me && me);
      return `
        <div class="devinette-box" style="margin-top:20px;">
          <h2 style="font-size:2rem; margin-bottom:6px;">⚡ QUESTION SURPRISE !</h2>
          <p style="font-size:1.1rem; font-weight:900; margin:0;">Remplacez les deux compléments par deux pronoms :</p>
          <p style="font-size:1.7rem; font-weight:900; margin:8px 0 12px;">« ${esc(qq.q)} »</p>
          ${mine ? `<p style="font-size:1.2rem; font-weight:900; margin:0;">✅ Réponse envoyée : « ${esc(mine.text)} »<br><small>Attendez le verdict de Madame la Juge…</small></p>` : `
            ${me ? '' : `<input id="me-name" class="name-input" placeholder="Votre nom" maxlength="40" style="margin-bottom:10px;">`}
            <input id="sp-answer" class="name-input" placeholder="Votre réponse…" maxlength="80" style="max-width:520px;" onkeydown="if(event.key==='Enter') sendSurprise(${tId})">
            <div class="flex-center" style="margin-top:12px;"><button class="btn-action" style="background:var(--pink); font-size:1.2rem; padding:12px 30px;" onclick="sendSurprise(${tId})">📨 Envoyer</button></div>`}
        </div>`;
    }

    // 5. ÉCRAN D'UNE BRIGADE
    function viewTeam(tId) {
      const state = getState();
      const team = TEAMS[tId];
      const ts = state.teams[tId];
      const totalQ = QUESTIONS[tId].length;
      const revealedLetters = lettersHtml(state, tId);
      const members = Object.keys(state.assignments).filter(k => state.assignments[k] === tId);

      let html = `
        <div class="top-bar" style="border-color:${team.color}; flex-wrap:wrap;">
          <span style="display:flex; align-items:center; gap:10px;"><button class="btn-action" style="background:var(--line); color:var(--ink); font-size:.95rem; padding:8px 14px;" onclick="location.hash=''" title="Accueil">🏠</button><span style="color:${team.color}; font-size:1.5rem;">${team.icon} ${team.name}</span></span>
          <span style="color:var(--gold); font-family:var(--display); font-size:1.2rem; letter-spacing:3px;">🔐 ${revealedLetters}</span>

        </div>`;
      const remT = getTimerRemaining(state);
      html += surpriseTeamHtml(state, tId);

      if (ts.state === "intro") {
        html += `
          <div class="card" style="margin-top:20px; border-color:var(--lav);">
            <span class="eyebrow">Dossier d'enquête</span>
            <h2 style="font-size:2.2rem;">Bienvenue, détectives ! 🕵️‍♀️</h2>
            <div style="margin-top:15px; font-weight:bold; color:var(--mute);">

              <span style="color:var(--ink); font-size:1.2rem;">${members.length ? members.map(esc).join(' • ') : 'En attente…'}</span>

              <p style="font-size:1.1rem; line-height:1.6; font-weight:bold;">

            </div>
            <div class="flex-center" style="margin-top:30px;">
              ${state.timer.isRunning
                ? `<button class="btn-action" style="background:var(--lav); font-size:1.3rem; padding:15px 30px;" onclick="startInvestigation(${tId})">Commencer l'enquête 🚀</button>`

          </div>`;

      if (!ts.ruleUnlocked && remT === 0) {
        return html + `

      if (!ts.ruleUnlocked && !state.timer.isRunning) {
        return html + `
          <div class="card" style="margin-top:20px; text-align:center; border-color:var(--sun);">

        if (!ts.ruleUnlocked) {

            <div class="card" style="margin-top:20px; border-color:var(--sun);">

                <h3 style="font-size:1.4rem;">${r.q}</h3>

          html += `
            <div class="card" style="margin-top:20px; text-align:center; border-color:var(--mint);">

      const q = QUESTIONS[tId][ts.qIndex];

      html += `

            <p style="color:var(--mute); font-weight:bold; font-size:1.1rem; margin:0 0 10px;">Le suspect déclare :</p>
            <h3 style="font-size:1.4rem; opacity:.8;">« ${q.src} »</h3>
            <h2 style="font-size:2rem; margin-top:15px;">➔ <span style="color:var(--pink);">« ${q.say} »</span></h2>
